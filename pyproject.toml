[project]
name = "framed-bot"
version = "0.1.0"
description = "Telegram bot for tracking Framed game results"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "python-telegram-bot[job-queue,rate-limiter]>=22.8",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ty>=0.0.92",
]

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["**/__pycache__", "**/.venv", "**/.git", "**/.codegraph"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.alembic]
script_location = "%(here)s/models/migrations"
prepend_sys_path = ["."]
